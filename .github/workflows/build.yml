name: "Build Free IPA"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Workspace for Swift Package
        run: |
          # Создаем простую обертку, чтобы Xcode понял структуру как приложение
          echo "import PackageDescription" > Package.swift

      - name: Build Archive
        run: |
          xcodebuild archive \
            -scheme SpotBrief \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/SpotBrief.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # Копируем скомпилированное приложение из архива в папку Payload
          cp -R $RUNNER_TEMP/SpotBrief.xcarchive/Products/Applications/*.app Payload/
          zip -r SpotBrief.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spotbrief-free-ipa
          path: SpotBrief.ipa
