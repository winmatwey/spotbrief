name: "Build Free IPA"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (No Sign)
        run: |
          xcodebuild build \
            -project SpotBrief.xcodeproj \
            -scheme SpotBrief \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          BUILD_DIR=~/Library/Developer/Xcode/DerivedData/SpotBrief-*/Build/Products/Release-iphoneos
          cp -R $BUILD_DIR/SpotBrief.app Payload/
          zip -r SpotBrief.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spotbrief-free-ipa
          path: SpotBrief.ipa
