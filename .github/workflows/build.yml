name: "Build Free IPA"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Swift Playgrounds App
        run: |
          # Собираем проект напрямую как Swift Package приложение
          xcodebuild build \
            -clpPackage SpotBrief \
            -scheme SpotBrief \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # Ищем скомпилированное приложение .app внутри DerivedData
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Ошибка: Приложение .app не найдено!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r SpotBrief.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spotbrief-free-ipa
          path: SpotBrief.ipa
