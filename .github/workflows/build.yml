name: "Build Free IPA"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project from SwiftPM
        run: |
          # Встроенная команда Apple, которая превратит Package.swift в полноценный .xcodeproj
          swift package generate-xcodeproj --output SpotBrief.xcodeproj

      - name: Build App (No Sign)
        run: |
          xcodebuild build \
            -project SpotBrief.xcodeproj \
            -scheme SpotBrief-Package \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          BUILD_DIR=~/Library/Developer/Xcode/DerivedData/SpotBrief-*/Build/Products/Release-iphoneos
          # Находим скомпилированный .app файл внутри DerivedData
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Ошибка: Приложение .app не найдено!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r SpotBrief.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spotbrief-free-ipa
          path: SpotBrief.ipa
