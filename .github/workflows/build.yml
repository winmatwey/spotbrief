name: "Build Free IPA"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App from SwiftPM
        run: |
          # Официальный метод сборки приложений из Swift Playgrounds / SwiftPM
          xcodebuild build \
            -package SpotBrief \
            -scheme SpotBrief \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/build

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # Находим скомпилированное приложение и упаковываем
          cp -R $RUNNER_TEMP/build/SpotBrief.app Payload/
          zip -r SpotBrief.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spotbrief-free-ipa
          path: SpotBrief.ipa
